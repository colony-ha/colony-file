<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Your private COLONY FILE cloud storage workspace.">
  <title>My Cloud — COLONY FILE</title>
  <link rel="icon" type="image/png" href="/colony-logo.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/" aria-label="COLONY FILE home">
      <img src="/colony-logo.png" alt="" class="brand-mark">
      <span>COLONY <b>FILE</b></span>
    </a>
    <div class="top-actions">
      <select id="language" class="language" aria-label="Language">
        <option value="en">EN</option><option value="fr">FR</option><option value="ar">العربية</option>
      </select>
      <a class="button button-outline" href="/">Home</a>
    </div>
  </header>
  <main class="dashboard-main">
    <section class="workspace-area" id="workspace-area">
      <div class="workspace-head">
        <div><div class="eyebrow" data-i18n="myCloud">MY CLOUD SPACE</div><h2 id="workspace-title">My files</h2><p id="workspace-email"></p></div>
        <button class="button button-outline" id="logout-button" type="button" data-i18n="signOut">Sign out</button>
      </div>
      <div class="storage-card">
        <div class="storage-top"><div><span data-i18n="storageUsed">Storage used</span><strong id="storage-numbers">0 B / 1 GB</strong></div><span id="plan-label" class="plan-pill">FREE</span></div>
        <div class="storage-track"><span id="storage-progress"></span></div>
        <small id="storage-remaining">1 GB available</small>
      </div>
      <div class="workspace-toolbar">
        <form id="folder-create-form" class="folder-create"><input name="name" maxlength="120" required placeholder="New folder name" aria-label="New folder name"><button class="button button-outline" type="submit" data-i18n="newFolder">New folder</button></form>
        <label class="button button-gold upload-button"><span data-i18n="uploadFiles">Upload files</span><input id="file-picker" type="file" multiple hidden></label>
      </div>
      <div class="workspace-message" id="workspace-message" role="status" aria-live="polite"></div>
      <div class="workspace-breadcrumb"><button id="root-folder" type="button" data-i18n="myFiles">My files</button><span id="folder-current"></span></div>
      <div class="workspace-grid" id="workspace-items"><p class="workspace-empty">Your files and folders will appear here.</p></div>
    </section>
  </main>
  <footer><a class="brand footer-brand" href="/"><img src="/colony-logo.png" alt="" class="brand-mark"><span>COLONY <b>FILE</b></span></a><span>© 2026 COLONY FILE. All rights reserved.</span><span class="footer-note">CREATE • STORE • SHARE</span></footer>
</body>
</html>
